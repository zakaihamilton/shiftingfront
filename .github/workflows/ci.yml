name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
      - name: Run tests with timing report
        run: |
          mkdir -p artifacts
          # The simulation suite is CPU-bound and the hosted runner exposes
          # fewer cores than Vitest's default pool. Keep the replay tests
          # within their per-test timeout instead of oversubscribing the job.
          yarn ci:timed-tests --maxWorkers=2
      - name: Upload test timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timing-${{ github.run_id }}
          path: artifacts/test-timing.json
          if-no-files-found: warn
          retention-days: 14

  health:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn health:invariants
      - name: Run performance health with timing report
        run: |
          mkdir -p artifacts
          yarn ci:timed-performance
      - name: Run balance health with timing report
        run: |
          mkdir -p artifacts
          yarn ci:timed-balance
      - run: yarn health:documentation
      - run: yarn health:dead-code
      - run: yarn health:duplication
      - name: Upload health timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-timing-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  archetype-balance:
    name: Archetype balance (${{ matrix.strategy }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        strategy: [rush, turtle, greed, infantry, vehicles]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Run stratified archetype balance
        run: |
          mkdir -p artifacts
          yarn ci:timed-balance-archetype --strategy "${{ matrix.strategy }}" > "artifacts/balance-archetype-${{ matrix.strategy }}-timing.json"
      - name: Upload archetype timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archetype-timing-${{ github.run_id }}-${{ matrix.strategy }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn playwright install --with-deps chromium webkit
      - run: yarn test:e2e
        env:
          CI: true
