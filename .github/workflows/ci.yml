name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  test:
    name: Test (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: yarn
          package-manager-cache: false
      - name: Cache node_modules
        uses: actions/cache@v6
        id: yarn-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}
      - if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - run: yarn lint
      - name: Run tests with timing report
        run: |
          mkdir -p artifacts
          # The simulation suite is CPU-bound and the hosted runner exposes
          # fewer cores than Vitest's default pool. Keep the replay tests
          # within their per-test timeout instead of oversubscribing the job.
          yarn ci:timed-tests --maxWorkers=2 --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: Upload test timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-timing-${{ github.run_id }}-shard-${{ matrix.shardIndex }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: yarn
          package-manager-cache: false
      - name: Cache node_modules
        uses: actions/cache@v6
        id: yarn-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}
      - if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn health:invariants
      - name: Run performance health with timing report
        run: |
          mkdir -p artifacts
          yarn ci:timed-performance
      - run: yarn health:documentation
      - run: yarn health:dead-code
      - run: yarn health:duplication
      - run: yarn health:audit
      - name: Upload health timing reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: health-timing-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  balance-health:
    name: Balance health (competent)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: yarn
          package-manager-cache: false
      - name: Cache node_modules
        uses: actions/cache@v6
        id: yarn-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}
      - if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - name: Run balance health with timing report
        run: |
          mkdir -p artifacts
          yarn ci:timed-balance > artifacts/balance-timing.json
      - name: Upload balance timing reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: balance-timing-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  archetype-balance:
    name: Archetype balance (${{ matrix.strategy }}, shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-24.04
    # The greed archetype intentionally runs long late-game economic missions
    # and exceeds the default 20-minute matrix budget on hosted runners.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - strategy: turtle
            shardIndex: 1
            shardTotal: 3
          - strategy: turtle
            shardIndex: 2
            shardTotal: 3
          - strategy: turtle
            shardIndex: 3
            shardTotal: 3
          - strategy: infantry
            shardIndex: 1
            shardTotal: 3
          - strategy: infantry
            shardIndex: 2
            shardTotal: 3
          - strategy: infantry
            shardIndex: 3
            shardTotal: 3
          - strategy: greed
            shardIndex: 1
            shardTotal: 3
          - strategy: greed
            shardIndex: 2
            shardTotal: 3
          - strategy: greed
            shardIndex: 3
            shardTotal: 3
          - strategy: vehicles
            shardIndex: 1
            shardTotal: 2
          - strategy: vehicles
            shardIndex: 2
            shardTotal: 2
          - strategy: rush
            shardIndex: 1
            shardTotal: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: yarn
          package-manager-cache: false
      - name: Cache node_modules
        uses: actions/cache@v6
        id: yarn-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}
      - if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - name: Run stratified archetype balance
        run: |
          mkdir -p artifacts
          yarn ci:timed-balance-archetype --strategy "${{ matrix.strategy }}" --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} > "artifacts/balance-archetype-${{ matrix.strategy }}-shard-${{ matrix.shardIndex }}-timing.json"
      - name: Upload archetype timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archetype-timing-${{ github.run_id }}-${{ matrix.strategy }}-shard-${{ matrix.shardIndex }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: E2E (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: yarn
          package-manager-cache: false
      - name: Cache node_modules
        uses: actions/cache@v6
        id: yarn-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}
      - if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('yarn.lock') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('yarn.lock') }}-
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}
      - name: Install Playwright browsers with deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps chromium webkit
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: yarn playwright install-deps chromium webkit
      - run: yarn test:e2e --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          CI: true

  visual-snapshots:
    name: Update Linux visual snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: yarn
          package-manager-cache: false
      - name: Cache node_modules
        uses: actions/cache@v6
        id: yarn-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}
      - if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}
      - name: Install Playwright browsers with deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: yarn playwright install-deps chromium
      - name: Write Linux visual snapshots
        run: yarn playwright test tests/e2e/visual.spec.ts --project=desktop --update-snapshots
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        with:
          name: linux-visual-snapshots
          path: tests/e2e/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 1
