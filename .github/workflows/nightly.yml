name: Nightly health

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: yarn
          package-manager-cache: false
      - name: Cache node_modules
        uses: actions/cache@v6
        id: yarn-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}
      - if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn health:invariants
      - run: yarn health:dead-code
      - name: Run coverage health with bounded workers
        # Coverage instrumentation makes the simulation tests CPU-bound on
        # hosted runners; keep the pool bounded so remaining long cases
        # do not contend with the rest of the suite. Large pathfinding
        # cohesion cases skip under coverage.
        run: yarn health:coverage --maxWorkers=2
      - name: Run performance health with timing report
        run: |
          mkdir -p artifacts
          yarn ci:timed-performance
      - name: Run balance health with timing report
        run: |
          mkdir -p artifacts
          yarn ci:timed-balance
      - run: yarn health:duplication
      - name: Upload nightly timing reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-health-timing-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  archetype-balance:
    name: Archetype balance (${{ matrix.strategy }})
    runs-on: ubuntu-24.04
    # Keep the nightly matrix budget aligned with CI; greed can exceed 20m.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        strategy: [rush, turtle, greed, infantry, vehicles]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: yarn
          package-manager-cache: false
      - name: Cache node_modules
        uses: actions/cache@v6
        id: yarn-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}
      - if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - name: Run stratified archetype balance
        run: |
          mkdir -p artifacts
          yarn ci:timed-balance-archetype --strategy "${{ matrix.strategy }}" > "artifacts/balance-archetype-${{ matrix.strategy }}-timing.json"
      - name: Upload archetype timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-archetype-timing-${{ github.run_id }}-${{ matrix.strategy }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
