name: Nightly health

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"

jobs:
  health:
    name: Nightly health
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          package-manager-cache: false
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: pnpm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.pnpm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm health:invariants
      - run: pnpm health:dead-code
      - name: Run coverage health with bounded workers
        # Coverage instrumentation makes the simulation tests CPU-bound on
        # hosted runners; keep the pool bounded so remaining long cases
        # do not contend with the rest of the suite. Large pathfinding
        # cohesion cases skip under coverage.
        run: pnpm health:coverage --maxWorkers=2
      - name: Run performance health with timing report
        run: |
          mkdir -p artifacts
          pnpm ci:timed-performance
      - name: Run balance health with timing report
        run: |
          mkdir -p artifacts
          pnpm ci:timed-balance
      - run: pnpm health:duplication
      - run: pnpm health:audit
      - name: Upload nightly timing reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-health-timing-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  archetype-balance:
    name: Archetype balance (${{ matrix.strategy }})
    runs-on: ubuntu-24.04
    # Keep the nightly matrix budget aligned with CI; greed can exceed 20m.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        strategy: [rush, turtle, greed, infantry, vehicles]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          package-manager-cache: false
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: pnpm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.pnpm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Run stratified archetype balance
        run: |
          mkdir -p artifacts
          pnpm ci:timed-balance-archetype --strategy "${{ matrix.strategy }}" > "artifacts/balance-archetype-${{ matrix.strategy }}-timing.json"
      - name: Upload archetype timing report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-archetype-timing-${{ github.run_id }}-${{ matrix.strategy }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
