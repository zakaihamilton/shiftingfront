name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CI: "true"

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.0
          cache: pnpm
          package-manager-cache: false

      - name: Verify tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          expected_tag="v${version}"
          if [[ "$TAG_NAME" != "$expected_tag" ]]; then
            echo "Release tag $TAG_NAME does not match package version $expected_tag." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification suite
        run: pnpm verify:fast

      - name: Run invariant tests
        run: pnpm health:invariants

      - name: Run performance health
        run: pnpm health:performance

      - name: Run balance health
        run: pnpm health:balance

      - name: Check documentation
        run: pnpm health:documentation

      - name: Check dead code
        run: pnpm health:dead-code

      - name: Check duplication
        run: pnpm health:duplication

      - name: Audit dependencies
        run: pnpm health:audit

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Build production application
        run: pnpm build

      - name: Run browser tests
        run: pnpm test:e2e

  release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          name: Shifting Front ${{ github.ref_name }}
          draft: false
          prerelease: false
